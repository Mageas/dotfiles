# Feeds the bar's spectrum module. Raw ASCII on stdout, one frame per line,
# values 0-100 separated by ';'. Quickshell launches this with `cava -p`.
[general]
mode = normal
framerate = 60
bars = 14
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
noise_reduction = 55
